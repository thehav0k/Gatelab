<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none" role="img" aria-label="GateLab">
  <!--
    GateLab horizontal logo — primary (dark surface / transparent background).
    Mark: 36×36 at (2, 2). Wordmark: starts at x=46.
  -->

  <!-- Mark group, centered in 40×40 slot -->
  <g transform="translate(4, 4)">
    <!-- G arc -->
    <path
      d="M24.65 28.35
         A14 14 0 1 1 34 20
         L27.5 20"
      stroke="#2583FF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Stub -->
    <line x1="20" y1="20" x2="27.5" y2="20" stroke="#2583FF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pin -->
    <circle cx="34" cy="20" r="2.2" fill="#35C9FF"/>
  </g>

  <!-- Wordmark "GateLab" — white, weight 600, Geist/system sans -->
  <text
    x="50"
    y="26"
    font-family="'Geist', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.02em"
    fill="#FFFFFF"
  >GateLab</text>
</svg>
