<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="GateLab">
  <!--
    GateLab favicon.svg — vector favicon for modern browsers.
    Dark navy square background (matches app dark theme) with electric blue G mark.
    The rounded rect ensures it looks good as a browser tab icon.
  -->
  <rect width="32" height="32" rx="7" fill="#0B1220"/>
  <!-- G arc -->
  <path
    d="M24.1 23.1
       A10 10 0 1 1 25.5 16
       L21 16"
    stroke="#2583FF"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Stub crossbar -->
  <line x1="16" y1="16" x2="21" y2="16" stroke="#2583FF" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Terminal pin -->
  <circle cx="25.5" cy="16" r="1.6" fill="#35C9FF"/>
</svg>
